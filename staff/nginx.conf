server {
    listen 80;
    server_name localhost;
    root /usr/share/nginx/html;
    index index.html;

    # The SPA route /assets conflicts with Vite's physical /assets directory.
    # Exact route matches must serve the SPA instead of redirecting/listing it.
    location = /assets {
        try_files /index.html =404;
    }

    location = /assets/ {
        try_files /index.html =404;
    }

    location / {
        try_files $uri $uri/ /index.html;
    }
}
